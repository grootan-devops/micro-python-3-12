name: Lint · Standard Checks

"on":
  workflow_dispatch:

run-name: "CI · ${{ github.event_name }} · ${{ github.sha }}"

concurrency:
  group: lint-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: grootan-devops/github-ci-library/.github/workflows/lint.yml@dev
    secrets: inherit
    permissions:
      contents: read
    with:
      lint-md-files: "*.md"
